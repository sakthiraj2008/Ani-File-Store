# Full Professional TH Player (Integrated Version)

```html
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>TH PLAYER</title>

    <!-- Plyr CSS -->
    <link rel="stylesheet" href="https://cdn.plyr.io/3.7.8/plyr.css"/>

    <!-- Font Awesome -->
    <link rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"/>

    <style>

        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
        }

        :root{
            --plyr-color-main:#ff1744;
        }

        body,html{
            width:100%;
            min-height:100vh;
            overflow-x:hidden;
            background:#050505;
            color:white;
            font-family:-apple-system,BlinkMacSystemFont,
            "Segoe UI",Roboto,Helvetica,Arial,sans-serif;

            display:flex;
            justify-content:flex-start;
            align-items:center;
            flex-direction:column;

            padding-top:30px;
            position:relative;
        }

        body::before{
            content:'';
            position:fixed;
            width:500px;
            height:500px;
            background:linear-gradient(45deg,#ff1744,#ff9100);
            border-radius:50%;
            filter:blur(160px);
            opacity:.35;
            animation:moveGlow 10s infinite alternate;
            z-index:0;
        }

        @keyframes moveGlow{
            0%{
                transform:translate(-150px,-100px);
            }

            100%{
                transform:translate(250px,150px);
            }
        }

        .player-wrapper{
            width:100%;
            max-width:1100px;
            padding:20px;
            position:relative;
            z-index:2;
        }

        .video-title{
            text-align:center;
            font-size:1rem;
            color:#cfcfcf;
            margin-bottom:18px;
            overflow:hidden;
            white-space:nowrap;
            text-overflow:ellipsis;
            letter-spacing:.5px;
        }

        .video-container{
            position:relative;
            border-radius:22px;
            overflow:hidden;
            background:rgba(255,255,255,.04);
            backdrop-filter:blur(18px);
            box-shadow:
            0 10px 40px rgba(0,0,0,.8),
            0 0 30px rgba(255,23,68,.15);
            transition:.4s;
        }

        .video-container:hover{
            transform:scale(1.005);
        }

        video{
            width:100%;
            height:auto;
            background:black;
        }

        .ambient{
            position:absolute;
            inset:0;
            pointer-events:none;
            background:
            radial-gradient(circle at center,
            rgba(255,23,68,.08),
            transparent 70%);
        }

        /* External Players */

        .external-players{
            margin-top:22px;
            display:flex;
            justify-content:center;
            flex-wrap:wrap;
            gap:14px;
        }

        .external-btn{
            text-decoration:none;
            color:white;
            background:rgba(255,255,255,.06);
            padding:12px 16px;
            border-radius:18px;
            display:flex;
            align-items:center;
            gap:10px;
            backdrop-filter:blur(10px);
            border:1px solid rgba(255,255,255,.08);
            transition:.35s;
            position:relative;
            overflow:hidden;
            min-width:140px;
            justify-content:center;
        }

        .external-btn::before{
            content:'';
            position:absolute;
            inset:0;
            background:
            linear-gradient(
            120deg,
            transparent,
            rgba(255,255,255,.18),
            transparent);
            transform:translateX(-100%);
            transition:.6s;
        }

        .external-btn:hover::before{
            transform:translateX(100%);
        }

        .external-btn:hover{
            transform:
            translateY(-4px)
            scale(1.03);
            box-shadow:
            0 0 20px rgba(255,23,68,.3);
        }

        .external-btn img{
            width:28px;
            height:28px;
            object-fit:contain;
            border-radius:8px;
        }

        .external-btn span{
            font-size:.92rem;
            font-weight:500;
        }

        .vlc:hover{
            background:#ff8800;
        }

        .mx:hover{
            background:#0066ff;
        }

        .km:hover{
            background:#7b2cff;
        }

        .xplayer:hover{
            background:#00b894;
        }

        @media(max-width:768px){

            body{
                padding-top:10px;
            }

            .player-wrapper{
                padding:10px;
            }

            .video-container{
                border-radius:16px;
            }

            .external-btn{
                min-width:120px;
                padding:10px 12px;
            }

            .external-btn img{
                width:24px;
                height:24px;
            }
        }

    </style>
</head>

<body>

    <div class="player-wrapper">

        <div class="video-title" id="videoTitle">
            {{file_name}}
        </div>

        <div class="video-container">

            <div class="ambient"></div>

            <video id="player" playsinline controls>
                <source src="{{file_url}}" type="video/mp4">
                Your browser does not support HTML5 video.
            </video>

        </div>

        <!-- External Players -->

        <div class="external-players">

            <a class="external-btn vlc" id="vlcBtn">
                <img src="https://upload.wikimedia.org/wikipedia/commons/9/9a/VLC_icon.png">
                <span>VLC</span>
            </a>

            <a class="external-btn mx" id="mxBtn">
                <img src="https://upload.wikimedia.org/wikipedia/commons/6/64/MX_Player_Logo.png">
                <span>MX Player</span>
            </a>

            <a class="external-btn km" id="kmBtn">
                <img src="https://upload.wikimedia.org/wikipedia/commons/8/8f/KMPlayer_logo.png">
                <span>KMPlayer</span>
            </a>

            <a class="external-btn xplayer" id="xBtn">
                <img src="https://play-lh.googleusercontent.com/HQkK5s2xQkQnW7fKjzR8qP7A8yL0gM8QmH6yD2N4y3u9zG7g2Y6h2vM0m0Q2K4M=s180">
                <span>XPlayer</span>
            </a>

        </div>

    </div>

    <!-- Plyr JS -->

    <script src="https://cdn.plyr.io/3.7.8/plyr.js"></script>

    <script>

        document.addEventListener('DOMContentLoaded', () => {

            const titleElement =
            document.getElementById('videoTitle');

            let text = titleElement.textContent;

            if(text.length > 70){
                titleElement.textContent =
                text.slice(0,70) + '...';
            }

            const player = new Plyr('#player', {

                controls: [
                    'play-large',
                    'rewind',
                    'play',
                    'fast-forward',
                    'progress',
                    'current-time',
                    'duration',
                    'mute',
                    'volume',
                    'settings',
                    'pip',
                    'fullscreen'
                ],

                settings: [
                    'quality',
                    'speed'
                ],

                speed:{
                    selected:1,
                    options:[0.5,1,1.25,1.5,1.75,2]
                },

                keyboard:{
                    focused:true,
                    global:true
                }

            });

            /* Landscape Fullscreen */

            player.on('enterfullscreen', () => {

                if(screen.orientation &&
                screen.orientation.lock){

                    screen.orientation
                    .lock('landscape')
                    .catch(err=>{
                        console.warn(err);
                    });
                }
            });

            player.on('exitfullscreen', () => {

                if(screen.orientation &&
                screen.orientation.unlock){
                    screen.orientation.unlock();
                }
            });

            /* External Player Links */

            const VIDEO_URL = "{{file_url}}";

            document
            .getElementById('vlcBtn')
            .href =
            `vlc://${VIDEO_URL}`;

            document
            .getElementById('mxBtn')
            .href =
            `intent:${VIDEO_URL}#Intent;package=com.mxtech.videoplayer.ad;end`;

            document
            .getElementById('kmBtn')
            .href =
            `intent:${VIDEO_URL}#Intent;package=com.kmplayer;end`;

            document
            .getElementById('xBtn')
            .href =
            `intent:${VIDEO_URL}#Intent;package=video.player.videoplayer;end`;

        });

    </script>

</body>
</html>
